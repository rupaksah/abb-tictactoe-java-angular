<section class="scoreboard" aria-label="Scoreboard">
  <h2>Scoreboard</h2>
  <div class="rows">
    <div class="row">
      <span class="label">X wins</span>
      <span class="value">{{ scoreboard().xWins }}</span>
    </div>
    <div class="row">
      <span class="label">O wins</span>
      <span class="value">{{ scoreboard().oWins }}</span>
    </div>
    <div class="row">
      <span class="label">Draws</span>
      <span class="value">{{ scoreboard().draws }}</span>
    </div>
  </div>
  <button type="button" class="reset-btn" (click)="resetScoreboard.emit()">Reset Scoreboard</button>
</section>
